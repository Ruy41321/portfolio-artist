name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio
  TEST_DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_test
  PAYLOAD_SECRET: ci-secret-not-for-production
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: portfolio-artist:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  compose-smoke:
    name: Production compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate .env
        run: SITE_URL=http://localhost:3000 APP_PORT=3000 ./scripts/setup.sh
      - name: Build and start the production stack
        run: APP_IMAGE=portfolio-artist:smoke docker compose -f compose.prod.yml up -d --build --wait --wait-timeout 300
      - name: Check health and home page
        run: |
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/it
          curl -fsS http://127.0.0.1:3000/it | grep -q '<html lang="it"'
      - name: Backup runs
        run: |
          docker compose -f compose.prod.yml exec -T backup /bin/sh /backup/backup.sh once
          ls -l backups
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.prod.yml logs --tail 200
      - name: Stop
        if: always()
        run: docker compose -f compose.prod.yml down -v
